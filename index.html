<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Orbit OS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="space"></canvas>

<!-- LOGIN -->
<div id="login" class="center">

  <div class="glass loginBox">

    <h1 class="logo">NEON ORBIT</h1>
    <p class="sub">Access Control System</p>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">ENTER SYSTEM</button>

    <p id="msg"></p>

  </div>

</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">

  <div class="sidebar glass">
    <h2>ORBIT</h2>

    <button onclick="switchTab('home')">Overview</button>
    <button onclick="switchTab('nodes')">Nodes</button>
    <button onclick="switchTab('logs')">Logs</button>
    <button onclick="logout()">Exit</button>
  </div>

  <div class="main">

    <div id="home" class="panel glass">
      <h1>System Overview</h1>
      <p>All systems operational.</p>
    </div>

    <div id="nodes" class="panel glass hidden">
      <h1>Neural Nodes</h1>
      <p>Connected: 128</p>
    </div>

    <div id="logs" class="panel glass hidden">
      <h1>System Logs</h1>
      <ul>
        <li>Boot sequence complete</li>
        <li>Orbit engine active</li>
        <li>Security layer online</li>
      </ul>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
